name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Testar
        run: python -m unittest discover -s testes -t . -v

      - name: Recalcular as tabelas do README
        run: python -m ferramentas.medidor

  ate_dezoito_digitos:
    # Treze milhoes de multiconjuntos, contra os 10^18 numeros que a forca
    # bruta olharia. O job confere o teto de 60 digitos antes de terminar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Varredura ate dezoito digitos
        run: python -m ferramentas.medidor --completo
